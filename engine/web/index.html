<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DayROAD</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app" id="app">
  <nav class="side" id="side" aria-label="메뉴"></nav>
  <main class="main" id="main">
    <div id="mainHead"></div>
    <div class="quick" id="quick">
      <div class="qbox">
        <svg class="qplus" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        <label for="qInput" class="sr">새 할 일</label>
        <input id="qInput" autocomplete="off" spellcheck="false" placeholder="할 일을 적고 Enter — 예: 금요일까지 보고서, 매주 월 9시 회의">
        <button type="button" class="btn primary" id="qAdd">추가</button>
      </div>
      <div class="qchips" id="qChips" aria-live="polite"></div>
    </div>
    <div id="mainBody"></div>
  </main>
  <aside class="detail" id="detail" aria-label="할 일 자세히"></aside>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/js/core.js"></script>
<script src="/js/parse.js"></script>
<script src="/js/views.js"></script>
<script src="/js/detail.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/sync.js"></script>
<script src="/js/main.js"></script>
</body>
</html>

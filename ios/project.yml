# DayROAD 아이폰 (XcodeGen 설명서) — 빌드 서버(scripts/ci-ios.sh)가 이걸로 DayROAD.xcodeproj 를 만들어요.
# 사용자는 만들어진 DayROAD.xcodeproj 를 맥의 Xcode 로 열고, 무료 애플 ID 팀을 고른 뒤 ▶ 로 아이폰에 설치해요.
# 대상: DayROAD(앱 + 위젯) · DayROADWidget(위젯) · DayROAD-NoWidget(위젯 없이 — 앱 그룹 서명이 막힐 때)
name: DayROAD
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  DayROAD:
    type: application
    platform: iOS
    sources:
      - path: DayROAD
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: DayROAD
        PRODUCT_BUNDLE_IDENTIFIER: com.neverthelessd.dayroad.iphone
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DayROAD.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: DayROADWidget
        embed: true
  DayROADWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: DayROADWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.neverthelessd.dayroad.iphone.widget
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  DayROAD-NoWidget:
    type: application
    platform: iOS
    sources:
      - path: DayROAD
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: DayROAD
        PRODUCT_BUNDLE_IDENTIFIER: com.neverthelessd.dayroad.iphone
        INFOPLIST_FILE: Config/App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  DayROAD:
    build:
      targets:
        DayROAD: all
        DayROADWidget: all
    run:
      config: Debug
  DayROAD-NoWidget:
    build:
      targets:
        DayROAD-NoWidget: all
    run:
      config: Debug
